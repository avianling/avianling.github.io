<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

  header {
    background: #16213e;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header button {
    background: none; border: none; color: #7ec8e3; font-size: 14px;
    cursor: pointer; padding: 6px 10px; border-radius: 4px;
    transition: background .15s;
  }
  header button:hover { background: rgba(255,255,255,.08); }
  header input[type=search] {
    background: #0f3460; border: 1px solid #2a4a7f; color: #eee;
    padding: 6px 12px; border-radius: 6px; font-size: 14px;
    outline: none; width: 260px; transition: border-color .15s;
  }
  header input[type=search]:focus { border-color: #7ec8e3; }
  header input[type=search]::placeholder { color: #667; }
  .back-btn { margin-left: auto; display: none; }
  .back-btn.visible { display: block; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  /* ── Gallery Grid ── */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .gallery .card {
    background: #16213e;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .gallery .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .gallery .card img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    display: block; background: #0f3460;
  }
  .gallery .card .label {
    padding: 10px 12px; font-weight: 500; font-size: 14px;
    text-align: center; color: #7ec8e3;
  }
  .gallery .card .meta {
    padding: 0 12px 10px; font-size: 12px; color: #aaa;
    text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Sub-image Grid ── */
  .subgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .subgrid .card {
    background: #16213e;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .subgrid .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .subgrid .card img {
    width: 100%; aspect-ratio: 4/3; object-fit: contain;
    display: block; background: #0f3460; padding: 8px;
  }
  .subgrid .card .label {
    padding: 10px 12px 0; font-weight: 500; font-size: 14px;
    text-align: center; color: #a0d8ef;
  }
  .subgrid .card .meta {
    padding: 4px 12px 10px; font-size: 12px; color: #aaa;
    text-align: center; line-height: 1.5;
  }
  .subgrid .card .meta .tag {
    display: inline-block; background: #0f3460; color: #7ec8e3;
    padding: 1px 7px; border-radius: 3px; margin: 2px 3px; font-size: 11px;
  }

  /* ── Sub-view heading ── */
  .sub-heading {
    font-size: 22px; font-weight: 600; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .sub-heading .count {
    font-size: 14px; font-weight: 400; color: #888; margin-left: auto;
  }

  /* ── Closeup Modal ── */
  .modal {
    display: none; position: fixed; z-index: 100;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.88);
    justify-content: center; align-items: center;
    cursor: pointer;
  }
  .modal.open { display: flex; }
  .modal img {
    max-width: 92vw; max-height: 92vh; object-fit: contain;
    border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,.6);
    cursor: default;
  }
  .modal .close-btn {
    position: absolute; top: 20px; right: 28px;
    background: none; border: none; color: #fff; font-size: 32px;
    cursor: pointer; opacity: .7; transition: opacity .15s;
  }
  .modal .close-btn:hover { opacity: 1; }

  .view { display: none; }
  .view.active { display: block; }

  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .subgrid { grid-template-columns: 1fr; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Image Gallery</h1>
  <input type="search" id="searchInput" placeholder="Search descriptions, types, tags…" oninput="onSearch()">
  <button class="back-btn" id="backBtn" onclick="showGallery()">← Back to gallery</button>
</header>

<div class="container">
  <!-- Gallery view -->
  <div class="view active" id="galleryView">
    <div class="gallery" id="galleryGrid"></div>
  </div>

  <!-- Sub-image view -->
  <div class="view" id="subView">
    <div class="sub-heading" id="subHeading"></div>
    <div class="subgrid" id="subGrid"></div>
  </div>
</div>

<!-- Closeup modal -->
<div class="modal" id="modal" onclick="closeModal(event)">
  <button class="close-btn" onclick="closeModal()">&times;</button>
  <img id="modalImg" src="" alt="closeup">
</div>

<script src="images.js"></script>
<script>
// ── Group images by objectId ──
function groupImages(items) {
  const groups = {};
  for (const item of items) {
    const key = item.objectId;
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  }
  return Object.keys(groups)
    .sort((a, b) => +a - +b)
    .map(k => ({ id: +k, files: groups[k] }));
}

// ── State ──
const groups = groupImages(IMAGES);
let currentGroup = null;
let searchQuery = '';

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Search ──
function onSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  renderGallery();
}

function groupMatches(group, query) {
  if (!query) return true;
  return group.files.some(item =>
    item.description.toLowerCase().includes(query) ||
    item.objectType.toLowerCase().includes(query) ||
    item.tags.some(t => t.toLowerCase().includes(query))
  );
}

// ── Render gallery (one thumbnail per group) ──
function showGallery() {
  document.getElementById('subView').classList.remove('active');
  document.getElementById('galleryView').classList.add('active');
  document.getElementById('backBtn').classList.remove('visible');
  document.getElementById('searchInput').style.display = '';
  currentGroup = null;
}

function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  const filtered = searchQuery ? groups.filter(g => groupMatches(g, searchQuery)) : groups;
  if (filtered.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:60px 0;">No objects match your search.</p>';
    return;
  }
  grid.innerHTML = filtered.map(g => {
    const first = g.files[0];
    const typeInfo = first.objectType ? ` &middot; ${first.objectType}` : '';
    return `
      <div class="card" onclick="showSubImages(${g.id})">
        <img src="Thumbnails/${first.path.split('/').pop()}" alt="Object ${g.id}" loading="lazy">
        <div class="label">Object ${g.id} (${g.files.length})${typeInfo}</div>
        <div class="meta">${escapeHtml(first.description || '')}</div>
      </div>
    `;
  }).join('');
}

// ── Render sub-images for a group ──
function showSubImages(groupId) {
  const g = groups.find(x => x.id === groupId);
  if (!g) return;
  currentGroup = g;

  document.getElementById('galleryView').classList.remove('active');
  document.getElementById('subView').classList.add('active');
  document.getElementById('backBtn').classList.add('visible');

  const item = g.files[0];
  const coords = (item.lat != null && item.lng != null)
    ? `<a href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank" rel="noopener" style="color:#7ec8e3;text-decoration:none;">${item.lat}, ${item.lng}</a>` : '';
  document.getElementById('subHeading').innerHTML =
    `Object ${g.id}${item.objectType ? ' &mdash; ' + item.objectType : ''}
     <span class="count">${g.files.length} image${g.files.length > 1 ? 's' : ''}${coords ? ' &middot; ' + coords : ''}</span>`;

  const grid = document.getElementById('subGrid');
  grid.innerHTML = g.files.map(item => {
    const name = item.path.split('/').pop();
    const tagsHtml = item.tags.length
      ? item.tags.map(t => `<span class="tag">${t}</span>`).join('')
      : '';
    return `
      <div class="card" onclick="openCloseup('${item.path}')">
        <img src="${item.path}" alt="${name}" loading="lazy">
        <div class="label">${escapeHtml(name)}</div>
        <div class="meta">${tagsHtml}${escapeHtml(item.description || '')}</div>
      </div>
    `;
  }).join('');
}

// ── Closeup modal ──
function openCloseup(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalImg').src = '';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Backspace' && currentGroup) showGallery();
});

// ── Init ──
renderGallery();
</script>
</body>
</html>
